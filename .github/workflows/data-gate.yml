name: Gate de dados publicados
on:
  push:
    paths:
      - "web/facts.json"
      - "web/clubs.json"
      - "tests/**"
      - ".github/workflows/data-gate.yml"
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
